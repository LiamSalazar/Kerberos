name: Maven

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Test
        run: mvn test

      - name: Test WebSocket Gateway
        run: mvn -pl auth-websocket-gateway -am test

      - name: Test SQLite Storage
        run: mvn -pl auth-storage-sqlite -am test
